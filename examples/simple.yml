# Simple single-workflow setup for repos that only benchmark PRs from the same
# repository (not forks) — e.g. a maintainer-only workflow. It benchmarks and
# comments in one job.
#
# This is an ALTERNATIVE to benchmark.yml + report.yml — install one setup or
# the other, never both.
#
# WARNING: do NOT switch this to `pull_request_target` to make it work for forks.
# That would run untrusted PR code with a write token. For fork support use the
# split benchmark.yml + report.yml instead.
name: Benchmarks (simple)

on:
  pull_request:
    branches: [master, main]
    # A docs-only PR can't move the numbers, so don't spend a benchmark budget on
    # it. NOTE: a skipped workflow never reports a status, so if you make the
    # benchmark a required check, drop this filter (or add a no-op fallback job).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
    # Draft PRs are benchmarked too (the default `types`), deliberately: perf
    # feedback is most useful while the work is still in progress.

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tachometer-simple-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    # Same-repo PRs only (fork PRs can't get a write token here anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Much less noisy than x64/macOS runners, but free for public repos only.
    # Must match track.yml's runner. See "Choosing a runner" in the README.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bench
        # This single action measures, uploads the report, updates the sticky
        # comment, and applies the optional regression gate.
        uses: KristofferC/Tachometer.jl@v1   # pin to a full SHA in production
        with:
          nruns: "3"
          comment: "true"
