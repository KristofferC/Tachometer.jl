# Trusted half of the secure two-workflow setup.
#
# This workflow never executes PR code. The reporter action resolves the PR from
# the trusted workflow_run event, downloads the benchmark artifact, validates and
# re-renders report.json, and updates the sticky comment. Use this together with
# benchmark.yml, instead of simple.yml.
name: Benchmark report

on:
  workflow_run:
    workflows: [Benchmarks] # must match the `name` in benchmark.yml
    types: [requested, completed]

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      # Requested and completed events use separate groups: a quick "running"
      # marker never waits behind a report, while newer markers supersede old ones.
      group: tachometer-report-${{ github.event.action }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: ${{ github.event.action == 'requested' }}
    steps:
      # Pin this write-capable action to the same full commit SHA as benchmark.yml.
      - uses: KristofferC/Tachometer.jl/reporter@0000000000000000000000000000000000000000
        # For a benchmark matrix, list the markers from benchmark.yml:
        # with:
        #   markers: "julia-1.10,julia-1.11"
