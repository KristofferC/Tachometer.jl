# Untrusted half of the secure two-workflow setup.
#
# Runs on `pull_request`, so it gets a read-only token and NO secrets even for
# fork PRs — safe, because this is the job that executes the PR's (untrusted)
# benchmark code. It only measures and uploads an artifact. The trusted
# reporter (report.yml) picks that artifact up and posts the comment.
#
# Use this together with report.yml, INSTEAD of simple.yml — not alongside it.
name: Benchmarks

on:
  pull_request:
    branches: [master, main]
    # A docs-only PR can't move the numbers, so don't spend a benchmark budget on
    # it. NOTE: a skipped workflow never reports a status, so if you make the
    # benchmark a required check, drop this filter (or add a no-op fallback job).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
    # Optional: uncomment to hold off until a PR is marked ready for review. This
    # trades away perf feedback while a PR is still a draft.
    # types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tachometer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so merge-base / worktrees work

      # The noise model is derived READ-ONLY from the default-branch time series
      # published by track.yml (so a PR can never train it). Extract that data
      # from the trusted gh-pages ref into a fresh dir OUTSIDE the PR checkout
      # (via `git archive`, so a PR-committed directory can't stand in for it). If
      # gh-pages doesn't exist yet the dir is empty and the model is simply unused.
      - name: Fetch published history (read-only noise source)
        run: |
          dest="${RUNNER_TEMP}/tacho-history"
          rm -rf "$dest"; mkdir -p "$dest"
          if git fetch --no-tags --depth=1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD benchmarks/data 2>/dev/null | tar -x -C "$dest" 2>/dev/null || true
          fi
        continue-on-error: true

      - uses: KristofferC/Tachometer.jl@v1   # this action; pin to a SHA in production
        with:
          julia-version: "1"
          script: benchmark/benchmarks.jl
          nruns: "2"
          time-tolerance: "0.05"
          time-floor: "1us"
          noise-history: ${{ runner.temp }}/tacho-history/benchmarks/data
